# 构建 BiliProbe.dylib —— 给哔哩哔哩官方 iOS 客户端（tv.danmaku.bilianime 9.12.0）
#
# 为什么必须走 CI：编译 arm64 iOS dylib 需要 Xcode + iOS SDK，
# 只有 macOS 有，Windows 无法合法取得。
#
# 两种产出：
#   1) artifact `BiliProbe-dylib`  → 只有 dylib，用「全能签 → 插件注入」装（推荐，不改 IPA）
#   2) artifact `BiliBili-injected-ipa` → 已注入 dylib 的 IPA，直接签名安装（备用）
#      需要传 ipa_url 或配 secret BILI_IPA_URL 指向脱壳 IPA 直链；没有就跳过，只出 dylib
#
# 重要：注入版与插件注入版**二选一**，不要同时用 —— 否则 dylib 会加载两次。

name: Build BiliProbe

# softprops/action-gh-release 建 release 需要 contents: write。
# 不加会报 "Resource not accessible by integration"（构建本身是成功的，
# 只有最后建 release 这步失败，容易误判成构建挂了）。
permissions:
  contents: write

"on":
  workflow_dispatch:
    inputs:
      ipa_url:
        description: '脱壳 IPA 直链（留空则读 secret BILI_IPA_URL；都没有就只出 dylib）'
        required: false
        type: string
      make_release:
        description: '发预发布并附上 dylib'
        type: boolean
        default: true
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', '_recon/**']

jobs:
  # ---------------------------------------------------------------- 纯 C 核心验证
  # SIDX 解析是纯字节逻辑，与 Foundation 无关，因此可以抽成纯 C 在 Linux 上跑。
  # 这样「解析器是否真的能解析规范字节」在 CI 里是真跑出来的，而不是只验证能编译。
  # 相比 macOS 构建（约 1 分钟且要排队），这里约 10 秒，反馈快得多。
  verify-sidx-core:
    name: Verify SIDX core (Linux, real fixtures)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile and run fixture tests
        run: |
          set -euxo pipefail
          cd inject/probe
          clang --version
          # -Werror：核心解析器必须零告警，否则说明有可疑写法
          clang -std=c11 -Wall -Wextra -Werror -O1 -g \
                -o /tmp/test_sidx_core \
                test_sidx_core.c BSSidxCore.c
          echo "编译通过"
          ls -la "$GITHUB_WORKSPACE/_recon/sidx_fixtures/"
          /tmp/test_sidx_core "$GITHUB_WORKSPACE/_recon/sidx_fixtures"

  # ---------------------------------------------------------------- ObjC 引擎运行测试
  # BSSegmentFetcher 依赖 Foundation 的 NSURLSession，只能在 macOS 上真跑。
  # 在此之前它**只通过编译、从未执行过** —— 这是本项目最大的一处"看着绿其实没验"。
  # 这里起一个按连接限速的 Range 服务器，真正验证并发、按序交付、重试降级。
  verify-segment-fetcher:
    name: Run BSSegmentFetcher (macOS, live HTTP)
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start throttled range server
        run: |
          set -euxo pipefail
          # 夹具只生成 8 段 × 128KiB = 1MiB：夹具配方已改为「按字节位置」编码，
          # 与分段方式无关，因此测试里 4KiB / 128KiB 各种粒度都能从这一个文件里取。
          # 限速 256 KiB/s/连接，测试用例按 128KiB 段跑，串行约 25s、并发 8 约 4s。
          python3 "$GITHUB_WORKSPACE/_recon/serve_test_data.py" 18080 "$RUNNER_TEMP/tdata" 8 131072 256 &
          echo $! > "$RUNNER_TEMP/srv.pid"
          for i in $(seq 1 40); do
            if curl -fsS -r 0-15 -o /dev/null "http://127.0.0.1:18080/f.m4s"; then
              echo "服务就绪（第 $i 次尝试）"; break
            fi
            sleep 0.5
          done
          ls -la "$RUNNER_TEMP/tdata/"
          EXPECT=$((8 * 131072))
          ACTUAL=$(stat -f%z "$RUNNER_TEMP/tdata/f.m4s")
          echo "夹具大小 $ACTUAL 期望 $EXPECT"
          [ "$ACTUAL" -eq "$EXPECT" ] || { echo "夹具大小不符"; exit 1; }

      - name: Verify fixture recipe
        run: |
          set -euxo pipefail
          python3 "$GITHUB_WORKSPACE/_recon/verify_fixture_recipe.py"

      - name: Compile and run fetcher test
        run: |
          set -euxo pipefail
          cd inject/probe
          SDK=$(xcrun --sdk macosx --show-sdk-path)
          clang -fobjc-arc -Wall -Wextra -Wno-unused-parameter \
                -isysroot "$SDK" -framework Foundation -framework AVFoundation \
                -I. -o /tmp/test_segment_fetcher \
                test_segment_fetcher.m BSSegmentFetcher.m BSSidxIndex.m BSSidxCore.c
          echo "编译通过"
          /tmp/test_segment_fetcher "http://127.0.0.1:18080"

      - name: Stop server
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/srv.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/srv.pid")" 2>/dev/null || true
          fi

  # ---------------------------------------------------------------- type encoding 解析
  # 上一版整个包空转，根因就是这段解析逻辑有 bug 且从未被验证过：
  # 它没跳过 encoding 里的「大小/偏移」数字，还把返回值当成了 self，
  # 于是所有 expectShapes 校验全部失败、所有 hook 拒绝安装，日志只剩一片 ✗。
  # 这里用**真机 classes.txt 逐字节导出**的 55 条夹具逐条断言，杜绝再犯。
  verify-enctypes:
    name: Verify type-encoding parser (Linux, real device fixtures)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile and run encoding tests
        run: |
          set -euxo pipefail
          cd inject/probe
          clang -std=c11 -Wall -Wextra -Werror -O2 -g \
                -o /tmp/test_enctypes \
                test_enctypes.c bsp_enctypes.c
          echo "编译通过"
          /tmp/test_enctypes

  # ---------------------------------------------------------------- 多 CDN 调度核心
  # 调度器（评分 + 令牌桶 + 分片规划）是纯 C，可在 Linux 上把行为真正跑出来：
  # 公式是否与 stormdl 参考一致、令牌桶是否真的封住了每主机上限、
  # 4 路并行相对单路的提速比。这些以前只有 Python 参考实现，C 侧从未执行过。
  verify-ms-core:
    name: Verify multi-CDN scheduler core (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile and run scheduler tests
        run: |
          set -euxo pipefail
          cd inject/probe
          clang --version
          clang -std=c11 -Wall -Wextra -Werror -O2 -g \
                -o /tmp/test_ms_core \
                test_ms_core.c bsp_ms_core.c -lm
          echo "编译通过"
          /tmp/test_ms_core

  # ---------------------------------------------------------------- 代理端到端
  # 这是本项目的核心：把播放器的一条连接拆成多 CDN 并发分片。
  # 只验「能编译」等于没验，所以这里起 N 个真限速上游 + 真 socket + 真 NSURLSession，
  # 逐字节校验内容、校验 206/Content-Range、并比较相对单链路的提速比。
  verify-proxy-e2e:
    name: Run BSPProxyServer end-to-end (macOS, live HTTP)
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start fake multi-CDN servers
        run: |
          set -euxo pipefail
          # 4 条上游，每台聚合 1 MiB/s（不是按连接！），夹具 12 MiB。
          # 夹具要足够大，否则整个传输跑在初始令牌/突发里，会报出假的提速比。
          python3 "$GITHUB_WORKSPACE/_recon/serve_multi_cdn.py" 18081 4 12582912 1048576 \
            > "$RUNNER_TEMP/cdn.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/cdn.pid"
          for i in $(seq 1 60); do
            if grep -q "ALL READY" "$RUNNER_TEMP/cdn.log"; then echo "上游就绪"; break; fi
            sleep 0.5
          done
          cat "$RUNNER_TEMP/cdn.log"
          grep -q "ALL READY" "$RUNNER_TEMP/cdn.log" || { echo "上游未就绪"; exit 1; }
          curl -fsS -r 0-15 -o /dev/null "http://127.0.0.1:18081/fixture.m4s"
          curl -fsS -r 0-15 -o /dev/null "http://127.0.0.1:18084/fixture.m4s"

      - name: Compile and run proxy E2E test
        run: |
          set -euxo pipefail
          cd inject/probe
          SDK=$(xcrun --sdk macosx --show-sdk-path)
          clang -fobjc-arc -Wall -Wextra -Wno-unused-parameter \
                -isysroot "$SDK" -framework Foundation \
                -I. -o /tmp/test_proxy_e2e \
                test_proxy_e2e.m BSPProxyServer.m BSPCdnPool.m BSPDynamicHook.m \
                bsp_ms_core.c bsp_enctypes.c
          echo "编译通过"
          /tmp/test_proxy_e2e 18081 4 12582912

      - name: Stop servers
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/cdn.pid" ]; then kill "$(cat "$RUNNER_TEMP/cdn.pid")" 2>/dev/null || true; fi

  # ---------------------------------------------------------------- 正式模块
  # BiliFast 是给用户日常用的版本：只保留真机验证过的链路（URL 改写 + 回环代理），
  # 不做类枚举/缓存盘点/播放器轮询，日志只有一份会话报告。
  # 与探针分开构建，避免把取证用的东西塞进日常使用的包里。
  build-fast:
    name: Build BiliFast (production)
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          set -euxo pipefail
          export THEOS="$RUNNER_TEMP/theos"
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          mkdir -p "$THEOS/sdks" "$THEOS/bin"
          if curl -fsSL --retry 2 -o "$RUNNER_TEMP/sdk.tar.xz" \
               https://github.com/theos/sdks/releases/latest/download/iPhoneOS16.5.sdk.tar.xz; then
            tar -xJf "$RUNNER_TEMP/sdk.tar.xz" -C "$THEOS/sdks"
          else
            SDKPATH=$(xcrun --sdk iphoneos --show-sdk-path)
            SDKVER=$(xcrun --sdk iphoneos --show-sdk-version)
            ln -sfn "$SDKPATH" "$THEOS/sdks/iPhoneOS${SDKVER}.sdk"
          fi

      - name: Build BiliFast.dylib
        run: |
          set -euxo pipefail
          export THEOS="$RUNNER_TEMP/theos"
          export PATH="$THEOS/bin:$PATH"
          cd inject/fast
          make clean || true
          make ARCHS=arm64
          find . -name '*.dylib' -exec ls -la {} \;

      - name: Verify dylib
        run: |
          set -euxo pipefail
          DYLIB=$(find inject/fast -name 'BiliFast.dylib' | head -1)
          [ -n "$DYLIB" ] || { echo "没找到 BiliFast.dylib"; exit 1; }
          echo "FAST_DYLIB=$DYLIB" >> "$GITHUB_ENV"
          file "$DYLIB"
          lipo -info "$DYLIB" | grep -q arm64 || { echo "不含 arm64"; exit 1; }
          if otool -L "$DYLIB" | tail -n +2 | grep -v -E '/System/Library/|/usr/lib/|@executable_path|@rpath'; then
            echo "存在非系统依赖，注入后可能加载失败"; exit 1
          fi
          python3 "$GITHUB_WORKSPACE/_recon/check_dylib_syms.py" "$DYLIB"

      - name: Package
        run: |
          set -euxo pipefail
          mkdir -p dist-fast/Frameworks
          cp "$FAST_DYLIB" dist-fast/Frameworks/BiliFast.dylib
          {
            echo "BiliFast —— 哔哩哔哩官方客户端「多 CDN 并发加速」模块"
            echo ""
            echo "安装：把 Frameworks/BiliFast.dylib 导入签名工具的插件注入列表，"
            echo "      或使用已注入好的 IPA。不要同时用两种方式（会加载两次）。"
            echo ""
            echo "使用：正常看视频即可，不需要任何操作。"
            echo "      日志与报告在「文件」App -> 我的 iPhone -> 哔哩哔哩 -> BiliFast/"
            echo "      report.txt 里的「并发收益」是关键指标："
            echo "        > 1.05  -> 并发有效"
            echo "        <= 1    -> 本机网络下单台 CDN 已不是瓶颈，本模块没有收益，建议卸掉"
            echo ""
            echo "开关（改完重启 App）："
            echo "      BiliFast/mode.txt   写 direct -> 完全不改写，退回原样播放"
            echo "      BiliFast/hosts.txt  每行一台 CDN，覆盖内置候选池"
          } > dist-fast/README.txt
          cat dist-fast/README.txt

      - name: Upload BiliFast dylib
        uses: actions/upload-artifact@v4
        with:
          name: BiliFast-dylib
          path: dist-fast/Frameworks/BiliFast.dylib
          if-no-files-found: error

  build:
    name: Build dylib
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          set -euxo pipefail
          export THEOS="$RUNNER_TEMP/theos"
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          mkdir -p "$THEOS/sdks" "$THEOS/bin"
          if curl -fsSL --retry 2 -o "$RUNNER_TEMP/sdk.tar.xz" \
               https://github.com/theos/sdks/releases/latest/download/iPhoneOS16.5.sdk.tar.xz; then
            tar -xJf "$RUNNER_TEMP/sdk.tar.xz" -C "$THEOS/sdks"
            echo "theos/sdks 预打包 SDK 就绪"
          else
            SDKPATH=$(xcrun --sdk iphoneos --show-sdk-path)
            SDKVER=$(xcrun --sdk iphoneos --show-sdk-version)
            echo "回退到 Xcode SDK $SDKPATH (version $SDKVER)"
            ln -sfn "$SDKPATH" "$THEOS/sdks/iPhoneOS${SDKVER}.sdk"
          fi
          ls -la "$THEOS/sdks/"

          # ldid：Theos 在 Darwin 上默认用 `ldid -S` 做 ad-hoc 签名
          # （makefiles/targets/_common/darwin_head.mk: TARGET_CODESIGN ?= ldid）。
          # runner 上两者都没有 → 直接以命令名调用 → 报 Error 127
          # （表现为 "Generating debug symbols" 之后突然失败，极易误判成 dsymutil 的问题）。
          # 放到 $THEOS/bin 即进 PATH，Theos 的 `__executable(ldid)` 检查会命中它。
          if ! command -v ldid >/dev/null 2>&1; then
            for url in \
              "https://github.com/theos/ldid/releases/latest/download/ldid_macosx_arm64" \
              "https://github.com/theos/ldid/releases/latest/download/ldid_macosx_x86_64" \
              "https://cdn.jsdelivr.net/gh/xerub/ldid@master/ldid"
            do
              echo "尝试获取 ldid: $url"
              if curl -fsSL --retry 2 -o "$THEOS/bin/ldid" "$url"; then
                chmod +x "$THEOS/bin/ldid"
                if "$THEOS/bin/ldid" -h >/dev/null 2>&1 || "$THEOS/bin/ldid" 2>&1 | head -1; then
                  echo "ldid 可用: $("$THEOS/bin/ldid" -h 2>&1 | head -1)"
                  break
                fi
              fi
              rm -f "$THEOS/bin/ldid"
            done
          fi
          export PATH="$THEOS/bin:$PATH"
          echo "--- 签名工具自检 ---"
          command -v ldid && ldid -h 2>&1 | head -2 || echo "!! 没有 ldid，将于构建时显式指定 codesign"

      - name: Build BiliProbe.dylib
        run: |
          set -euxo pipefail
          export THEOS="$RUNNER_TEMP/theos"
          export PATH="$THEOS/bin:$PATH"
          cd inject/probe
          make clean || true
          make ARCHS=arm64
          echo "--- 产物 ---"
          find . -name '*.dylib' -exec ls -la {} \;
      - name: Verify dylib
        run: |
          set -euxo pipefail
          DYLIB=$(find inject/probe -name 'BiliProbe.dylib' | head -1)
          if [ -z "$DYLIB" ]; then echo "没找到 BiliProbe.dylib"; exit 1; fi
          echo "DYLIB=$DYLIB" >> "$GITHUB_ENV"
          echo "=== file ==="
          file "$DYLIB"
          echo "=== lipo ==="
          lipo -info "$DYLIB"
          echo "=== 依赖（应全部为系统库）==="
          otool -L "$DYLIB"
          echo "=== 平台 / 安装名 ==="
          otool -l "$DYLIB" | grep -A5 -E 'LC_ID_DYLIB|LC_BUILD_VERSION' || true
          lipo -info "$DYLIB" | grep -q arm64 || { echo "不含 arm64"; exit 1; }
          if otool -L "$DYLIB" | tail -n +2 | grep -v -E '/System/Library/|/usr/lib/|@executable_path|@rpath'; then
            echo "存在非系统依赖，注入后可能加载失败"; exit 1
          fi

          # 符号表闸门：不得链接期引用 _objc_msgForward 之类的私有符号。
          # 一旦引用，某个 iOS 版本不再导出它时，dyld 会在加载 dylib 的瞬间
          # 杀掉进程 —— 连日志目录都建不出来，真机上无法诊断。
          python3 "$GITHUB_WORKSPACE/_recon/check_dylib_syms.py" "$DYLIB"
          echo "dylib 校验通过"

      - name: Package for signing tools
        run: |
          set -euxo pipefail
          mkdir -p dist/Frameworks
          cp "$DYLIB" dist/Frameworks/BiliProbe.dylib
          {
            echo "BiliProbe.dylib —— 哔哩哔哩官方客户端注入探针（阶段 1）"
            echo ""
            echo "安装方式（二选一，不要同时用）："
            echo ""
            echo "【方式 A · 推荐】全能签 插件注入"
            echo "  1. 把 Frameworks/BiliProbe.dylib 导入全能签的插件列表"
            echo "  2. 对该 IPA 启用插件注入，选中 BiliProbe.dylib"
            echo "  3. 用你自己的证书签名并安装"
            echo "  这样不改 IPA 本体，由工具追加 LC_LOAD_DYLIB。"
            echo ""
            echo "【方式 B】直接用 CI 产出的注入版 IPA"
            echo "  下载 artifact BiliBili-injected-ipa，直接签名安装。"
            echo "  注意：方式 B 的包已带 LC_LOAD_DYLIB，再叠加方式 A 会加载两次。"
            echo ""
            echo "装好后："
            echo "  打开 App -> 随便播一个视频 -> 等 10 秒"
            echo "  文件 App -> 我的 iPhone -> 哔哩哔哩 -> biliprobe/"
            echo "    trace.log                 主日志"
            echo "    environment.txt           注入自检（系统/越狱痕迹/加载镜像）"
            echo "    cdn-selectors.txt         CDN 选择点落在哪个类"
            echo "    resloader-delegates.txt   资源加载 delegate 实现者"
            echo "    classes.txt               运行时类侦察（定向 class-dump）"
            echo ""
            echo "把整个 biliprobe 目录打包发回来即可。"
          } > dist/README.txt
          cat dist/README.txt

      - name: Download decrypted IPA (optional)
        id: getipa
        if: ${{ github.event_name == 'push' || inputs.ipa_url != '' }}
        env:
          IPA_URL: ${{ inputs.ipa_url || secrets.BILI_IPA_URL }}
        run: |
          set -euxo pipefail
          if [ -z "${IPA_URL:-}" ]; then
            echo "未提供 IPA 直链，跳过注入步骤（只出 dylib）"
            echo "have_ipa=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          curl -fL --retry 3 -o "$RUNNER_TEMP/app.ipa" "$IPA_URL"
          ls -la "$RUNNER_TEMP/app.ipa"
          unzip -l "$RUNNER_TEMP/app.ipa" | grep -q 'Payload/.*\.app/$' \
            || { echo "下载物不是有效 IPA"; exit 1; }
          echo "have_ipa=yes" >> "$GITHUB_OUTPUT"

      - name: Inject dylib and re-sign
        if: steps.getipa.outputs.have_ipa == 'yes'
        run: |
          set -euxo pipefail
          python3 -m pip install --quiet --disable-pip-version-check pyyaml || true

          rm -rf work && mkdir work && cd work
          unzip -q "$RUNNER_TEMP/app.ipa"
          APP=$(ls -d Payload/*.app | head -1)
          APPNAME=$(basename "$APP" .app)
          echo "APP=$APP APPNAME=$APPNAME"

          mkdir -p "$APP/Frameworks"
          cp "$GITHUB_WORKSPACE/$DYLIB" "$APP/Frameworks/BiliProbe.dylib"

          cd "$GITHUB_WORKSPACE"
          python3 inject/inject_dylib.py \
            --ipa "$RUNNER_TEMP/app.ipa" \
            --out "$RUNNER_TEMP/app.injected.ipa" \
            --executable "Payload/$APPNAME/$APPNAME"

          rm -rf work2 && mkdir work2 && cd work2
          unzip -q "$RUNNER_TEMP/app.injected.ipa"
          APP2=$(ls -d Payload/*.app | head -1)

          # 4) entitlements：脱壳包不含 embedded.mobileprovision，但主二进制里
          #    通常还留着原 App Store 的代码签名，可直接把它内嵌的 entitlements 抽出来。
          #    抽不到就用最小集合兜底（自签场景够用；全能签签名时会替换）。
          ENT="$RUNNER_TEMP/ent.plist"
          BIN2="$APP2/$(basename "$APP2" .app)"
          if codesign -d --entitlements :- "$BIN2" > "$ENT" 2>/dev/null \
               && [ -s "$ENT" ] && plutil -lint "$ENT" >/dev/null 2>&1; then
            echo "已从原二进制抽出 entitlements："
            plutil -p "$ENT"
          else
            echo "未抽到 entitlements，使用最小兜底集合"
            printf '%s\n' \
              '<?xml version="1.0" encoding="UTF-8"?>' \
              '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
              '<plist version="1.0">' \
              '<dict>' \
              '  <key>get-task-allow</key>' \
              '  <false/>' \
              '</dict>' \
              '</plist>' > "$ENT"
            plutil -lint "$ENT"
          fi

          find "$APP2" -depth \( -name '*.dylib' -o -name '*.framework' -o -name '*.appex' \) -print0 \
            | xargs -0 -I{} codesign -f -s - --timestamp=none {} || true
          codesign -f -s - --timestamp=none "$APP2/Frameworks/BiliProbe.dylib"
          codesign -f -s - --timestamp=none --entitlements "$ENT" "$APP2"

          echo "=== 签名校验 ==="
          codesign -dv --verbose=4 "$APP2" 2>&1 | head -20 || true
          codesign -dv "$APP2/Frameworks/BiliProbe.dylib" 2>&1 | head -10 || true

          cd "$GITHUB_WORKSPACE"
          mkdir -p dist
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent \
            "work2/$APP2" "dist/BiliBili-9.12.0-BiliProbe-unsigned.ipa"
          ls -la dist/

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: BiliProbe-dylib
          path: dist/Frameworks/BiliProbe.dylib
          if-no-files-found: error

      - name: Upload plugin package
        uses: actions/upload-artifact@v4
        with:
          name: BiliProbe-plugin-package
          path: dist/
          if-no-files-found: error

      - name: Upload injected IPA
        if: steps.getipa.outputs.have_ipa == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: BiliBili-injected-ipa
          path: dist/*.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Release dylib only
        if: ${{ github.event_name == 'push' || inputs.make_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: probe-${{ github.run_number }}
          name: BiliProbe 探针 ${{ github.run_number }}
          prerelease: true
          files: dist/Frameworks/BiliProbe.dylib
          body: |
            哔哩哔哩官方客户端注入探针（阶段 1）。

            只包含 dylib —— 不含任何哔哩哔哩官方客户端二进制。
            用法见 artifact `BiliProbe-plugin-package` 里的 README.txt。
